name: Ilyich
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '27.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
packages:
  IlyichKit:
    path: Packages/IlyichKit
targets:
  Ilyich:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: IlyichKit
        product: IlyichPlatform
      - package: IlyichKit
        product: IlyichShareInbox
      - target: ShareExtension
    preBuildScripts:
      # One upload engine at a time: fails the build if a second background session could appear.
      - name: Check single upload engine
        script: '"$SRCROOT/scripts/check-single-engine.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # iPhone only: XcodeGen's application preset sets iPhone and iPad on the target, over the
        # project's setting.
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Ilyich.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Share
        excludes: [Info.plist, PrivacyInfo.xcprivacy, ShareExtension.entitlements]
      - path: Extensions/Share/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: IlyichKit
        product: IlyichPlatform
      - package: IlyichKit
        product: IlyichShareInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).ShareExtension
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: Extensions/Share/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        # The App Group alone: the extension stages files and reads no Wi-Fi name.
        CODE_SIGN_ENTITLEMENTS: Extensions/Share/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  IlyichTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures, "Fixtures/**"]
      # Golden files, copied as one folder so their paths are kept.
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Ilyich
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ilyador.ilyich.tests
        GENERATE_INFOPLIST_FILE: YES
  IlyichUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Ilyich
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ilyador.ilyich.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ilyich:
    build:
      targets:
        Ilyich: all
        IlyichTests: [test]
        IlyichUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - IlyichTests
        - IlyichUITests
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
    archive:
      config: Release
