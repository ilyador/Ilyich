name: Ilyich
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.6
targets:
  Ilyich:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: GoogleCast
        product: GoogleCastDynamic
      - target: ShareExtension
      - target: WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alextran.immich
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Ilyich.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Share
        excludes: [Info.plist]
      - Sources/Backup/SharedSession.swift
      - Sources/Core/NetworkConfiguration.swift
      - Sources/Core/ServerConnection.swift
      - Sources/Backup/UploadBody.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alextran.immich.ShareExtension
        INFOPLIST_FILE: Extensions/Share/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/Ilyich.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  WidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Widget
        excludes: [Info.plist]
      - Sources/Backup/SharedSession.swift
      - Sources/Core/NetworkConfiguration.swift
      - Sources/Core/ServerConnection.swift
      - path: ../mobile/ios/WidgetExtension/widgets
      - ../mobile/ios/WidgetExtension/WidgetBundle.swift
      - ../mobile/ios/WidgetExtension/UIImage+Resize.swift
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alextran.immich.WidgetExtension
        INFOPLIST_FILE: Extensions/Widget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/Ilyich.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: '5.0'
  IlyichTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Ilyich
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alextran.immich.tests
        GENERATE_INFOPLIST_FILE: YES
  IlyichUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Ilyich
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alextran.immich.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ilyich:
    build:
      targets:
        Ilyich: all
        IlyichTests: [test]
        IlyichUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: en
      region: US
      targets:
        - IlyichTests
        - IlyichUITests
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
    archive:
      config: Release
