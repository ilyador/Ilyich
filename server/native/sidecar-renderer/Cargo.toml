[package]
name = "immich-sidecar-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
bytemuck = "1"
lightcraft-engine = { git = "https://github.com/ilyador/lightcraft", rev = "9e0cfec581d25808bba7fa7da4f339713ad27691", default-features = false }
lightcraft-meta = { git = "https://github.com/ilyador/lightcraft", rev = "9e0cfec581d25808bba7fa7da4f339713ad27691" }
lightcraft-codecs = { git = "https://github.com/ilyador/lightcraft", rev = "9e0cfec581d25808bba7fa7da4f339713ad27691", default-features = false }
lightcraft-color = { git = "https://github.com/ilyador/lightcraft", rev = "9e0cfec581d25808bba7fa7da4f339713ad27691" }
lightcraft-geom = { git = "https://github.com/ilyador/lightcraft", rev = "9e0cfec581d25808bba7fa7da4f339713ad27691" }
lightcraft-raster = { git = "https://github.com/ilyador/lightcraft", rev = "9e0cfec581d25808bba7fa7da4f339713ad27691" }
lightcraft-raw = { git = "https://github.com/ilyador/lightcraft", rev = "9e0cfec581d25808bba7fa7da4f339713ad27691" }
quick-xml = "0.38"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
undocumented_unsafe_blocks = "deny"
