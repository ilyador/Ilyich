name: Build unsigned Ilyich iOS IPA

on:
  push:
    branches: [dev]
    paths:
      - 'mobile/**'
      - 'native/**'
      - 'i18n/**'
      - 'open-api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/build-ios-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BASE_SOURCE_COMMIT: f5618abcc181b813a76d482d16876f9a44e6f331
      UPSTREAM_RELEASE: v3.3.3
      UPSTREAM_RELEASE_COMMIT: d2dac658fe1c67e8bbd08aa18200a32e5d45b9e4
      BUNDLE_GEMFILE: ${{ github.workspace }}/mobile/ios/Gemfile
      ARTIFACT_DIR: ${{ github.workspace }}/ios-unsigned-artifact
    steps:
      - name: Checkout exact build revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install locked toolchain
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ./mobile/ios

      - name: Install translation formatting dependencies
        run: pnpm --filter immich-monorepo install --frozen-lockfile --ignore-scripts

      - name: Install mobile dependencies
        run: |
          mise trust mise.toml
          mise trust mobile/mise.toml
          bundle exec mise //mobile:install:ci

      - name: Generate mobile code
        run: mise //mobile:codegen

      - name: Synchronize app and extension versions
        working-directory: ./mobile/ios
        run: |
          bundle exec ruby <<'RUBY'
          require 'yaml'
          require 'xcodeproj'

          version, build = YAML.safe_load(File.read('../pubspec.yaml')).fetch('version').split('+', 2)
          raise 'Expected a release version and numeric build number' unless version.match?(/\A\d+\.\d+\.\d+\z/) && build&.match?(/\A\d+\z/)

          project = Xcodeproj::Project.open('Runner.xcodeproj')
          %w[Runner ShareExtension WidgetExtension].each do |name|
            target = project.targets.find { |candidate| candidate.name == name }
            raise "Missing Xcode target: #{name}" unless target
            target.build_configurations.each do |configuration|
              configuration.build_settings['MARKETING_VERSION'] = version
              configuration.build_settings['CURRENT_PROJECT_VERSION'] = build
            end
          end
          project.save
          RUBY

      - name: Build release app without signing
        working-directory: ./mobile
        run: bundle exec flutter build ios --release --no-codesign --no-pub

      - name: Package complete unsigned app
        shell: bash
        run: |
          set -euo pipefail
          apps=( "$GITHUB_WORKSPACE/mobile/build/ios/iphoneos/"*.app )
          if [ "${#apps[@]}" -ne 1 ] || [ ! -d "${apps[0]}" ]; then
            echo '::error::Expected exactly one built top-level iOS app bundle'
            exit 1
          fi
          app="${apps[0]}"
          app_name="${app##*/}"
          test -f "$app/Info.plist"
          test -d "$app/PlugIns/ShareExtension.appex"
          test -d "$app/PlugIns/WidgetExtension.appex"
          test ! -e "$app/embedded.mobileprovision"
          for bundle in "$app" "$app/PlugIns/ShareExtension.appex" "$app/PlugIns/WidgetExtension.appex"; do
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Info.plist")
            xcrun lipo "$bundle/$executable" -verify_arch arm64
          done
          staging_dir=$(mktemp -d "$RUNNER_TEMP/ios-payload.XXXXXX")
          mkdir -p "$staging_dir/Payload" "$ARTIFACT_DIR"
          ditto "$app" "$staging_dir/Payload/$app_name"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          ipa_name="Ilyich-${app_version}-unsigned.ipa"
          ditto -c -k --norsrc --noextattr --keepParent "$staging_dir/Payload" "$ARTIFACT_DIR/$ipa_name"
          unzip -t "$ARTIFACT_DIR/$ipa_name"
          printf 'IPA_FILENAME=%s\n' "$ipa_name" >> "$GITHUB_ENV"

      - name: Record source and archive provenance
        env:
          BUILD_SOURCE_COMMIT: ${{ github.sha }}
          BUILD_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import plistlib
          import subprocess
          import zipfile

          output = pathlib.Path(os.environ['ARTIFACT_DIR'])
          ipa = output / os.environ['IPA_FILENAME']
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['BUILD_SOURCE_COMMIT'], 'Unexpected source revision'
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              assert all(name.startswith('Payload/') for name in names), 'Unexpected IPA root'
              app_bundles = set()
              for name in names:
                  parts = pathlib.PurePosixPath(name).parts
                  if len(parts) >= 2 and parts[1].endswith('.app'):
                      app_bundles.add('/'.join(parts[:2]))
              assert len(app_bundles) == 1, 'Expected exactly one top-level app bundle'
              app_bundle = next(iter(app_bundles))
              assert f'{app_bundle}/Info.plist' in names, 'Missing app bundle Info.plist'
              bundles = []
              for bundle in (app_bundle, f'{app_bundle}/PlugIns/ShareExtension.appex', f'{app_bundle}/PlugIns/WidgetExtension.appex'):
                  info = plistlib.loads(archive.read(f'{bundle}/Info.plist'))
                  executable = f"{bundle}/{info['CFBundleExecutable']}"
                  assert executable in names, f'Missing executable: {executable}'
                  bundles.append({
                      'path': bundle,
                      'bundleId': info['CFBundleIdentifier'],
                      'displayName': info.get('CFBundleDisplayName', info.get('CFBundleName')),
                      'version': info['CFBundleShortVersionString'],
                      'build': info['CFBundleVersion'],
                      'minimumOSVersion': info.get('MinimumOSVersion'),
                  })
              assert bundles[0]['displayName'] == 'Ilyich', 'Unexpected app display name'
              assert all(
                  bundle['version'] == bundles[0]['version'] and bundle['build'] == bundles[0]['build']
                  for bundle in bundles
              ), 'App and extension versions must match'
          checksum = hashlib.sha256()
          with ipa.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  checksum.update(chunk)
          digest = checksum.hexdigest()
          metadata = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sourceCommit': source,
              'baseSourceCommit': os.environ['BASE_SOURCE_COMMIT'],
              'upstreamRelease': os.environ['UPSTREAM_RELEASE'],
              'upstreamReleaseCommit': os.environ['UPSTREAM_RELEASE_COMMIT'],
              'workflowCommit': os.environ['BUILD_WORKFLOW_COMMIT'],
              'workflowRun': os.environ['BUILD_RUN_URL'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'buildMode': 'release',
              'signed': False,
              'requiresSigningBeforeInstallation': True,
              'ipa': ipa.name,
              'sha256': digest,
              'bundles': bundles,
          }
          (output / 'provenance.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (output / 'SHA256SUMS').write_text(f'{digest}  {ipa.name}\n')
          PY

      - name: Record resolved tool versions
        working-directory: ./mobile
        run: |
          {
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            mise --version
            flutter --version
            dart --version
            rustc --version
            cargo --version
            node --version
            pnpm --version
            ruby --version
            bundle exec pod --version
          } > "$ARTIFACT_DIR/tool-versions.txt" 2>&1
          mise ls --current --json > "$ARTIFACT_DIR/toolchain.json"
          cp ios/Gemfile.lock "$ARTIFACT_DIR/Gemfile.lock"

      - name: Upload unsigned IPA and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ilyich-ios-unsigned
          path: ios-unsigned-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
